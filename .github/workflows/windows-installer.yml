name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - windows-installer
    paths:
      - "desktop/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Windows Setup erstellen
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm-Version festlegen
        working-directory: desktop
        run: npm install --global npm@10.9.2

      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Programmcode prüfen
        working-directory: desktop
        run: npm run check

      - name: Windows-Installer bauen
        working-directory: desktop
        run: npm run dist:win

      - name: Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TCG-Business-Manager-Setup-5.1.0
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
