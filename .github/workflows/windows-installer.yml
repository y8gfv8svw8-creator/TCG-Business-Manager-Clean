name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - windows-installer
    paths:
      - "desktop/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Windows Setup erstellen
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm-Version festlegen
        working-directory: desktop
        run: npm install --global npm@10.9.2

      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Programmcode prüfen
        working-directory: desktop
        run: npm run check

      - name: Konsistente Release-Version prüfen
        working-directory: desktop
        run: npm run release:verify

      - name: Patch-Erhöhung gegenüber dem vorherigen Entwicklungsstand prüfen
        shell: pwsh
        run: |
          $currentPackage = Get-Content -Raw -Encoding utf8 desktop/package.json | ConvertFrom-Json
          $before = '${{ github.event.before }}'
          if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
            $before = git rev-parse HEAD^
            if ($LASTEXITCODE -ne 0) {
              throw 'Für die Patch-Prüfung ist kein vorheriger Entwicklungsstand verfügbar.'
            }
          }
          $previousJson = git show "${before}:desktop/package.json"
          if ($LASTEXITCODE -ne 0) {
            throw 'Die vorherige package.json konnte nicht gelesen werden.'
          }
          $previousPackage = $previousJson | ConvertFrom-Json
          $current = [version]$currentPackage.version
          $previous = [version]$previousPackage.version
          if ($current.Major -ne $previous.Major -or $current.Minor -ne $previous.Minor -or $current.Build -ne ($previous.Build + 1)) {
            throw "Für einen neuen installierbaren Entwicklungsstand muss die Patch-Version genau um 1 steigen: vorher $previous, aktuell $current."
          }
          Write-Host "Patch-Version korrekt erhöht: $previous -> $current"

      - name: Windows-Installer bauen
        working-directory: desktop
        run: npm run dist:win

      - name: Programmversion für Downloadnamen lesen
        id: package_version
        working-directory: desktop
        shell: pwsh
        run: |
          $package = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Installer bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: TCG-Business-Manager-Setup-${{ steps.package_version.outputs.version }}
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
